# Inspired heavily by the following workflows
# https://github.com/arichornlover/uYouEnhanced/blob/main/.github/workflows/buildapp.yml
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
# https://github.com/BandarHL/BHTwitter/actions/workflows/build.yml

name: Build and Package Instagram X

on:
    # Pushing the sideload scripts rebuilds the owner's pre-tweaked base IPA.
    # Other commits on this branch do not match these paths, so they do not
    # start another 289 MB packaging run.
    push:
        branches:
            - cursor/instagram-x-v2-8ca9
        paths:
            - .github/workflows/buildapp.yml
            - Makefile
            - build.sh
            - control
            - scripts/**
            - src/**
            - vendor/ixray/**
            - resources/AppIcon/**
    workflow_dispatch:
        inputs:
            decrypted_instagram_url:
                description: "Direct URL to a decrypted Instagram IPA you already have the right to use. The default is the owner's Instagram 436 IPA on the base-ipa release. The workflow strips the closed injection before adding Instagram X."
                default: "https://github.com/kamyarjobsss/SCInsta/releases/download/base-ipa/instagram-v436.ipa"
                required: true
                type: string
            expected_sha256:
                description: "sha256 of the input IPA. Use skip to disable the check. Empty falls back to the known base IPA hash."
                default: "20f6f7d07523d9f3c0b83faf684b544a58555494f3fbf2e13aa862eefb60357a"
                required: false
                type: string
            upload_artifact:
                description: "Upload Artifact"
                default: true
                required: false
                type: boolean
            publish_release:
                description: "Publish a prerelease tagged instagram-x-v2.1.5"
                default: true
                required: false
                type: boolean
            bundle_id:
                description: "Optional bundle id so Instagram X installs beside the App Store app. Leave empty to keep com.burbn.instagram."
                default: ""
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build Instagram X IPA
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.26.x'

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            # theos/logos master (777925d, theos/logos#114) rewrote %orig handling: it now
            # replaces everything from %orig to end-of-line and re-appends only ";", so any
            # %orig that is not alone on its line -- VOID_HANDLESCREENSHOT(%orig),
            # [SCIUtils liquidGlassEnabledBool:%orig], removeItemsInList(%orig, YES) -- loses
            # its closing bracket and the generated code no longer compiles. a623700 is the
            # commit directly before that change; drop this step once #114 is fixed upstream.
            - name: Pin Logos to known-good version
              run: |
                cd "$THEOS/vendor/logos"
                git fetch --depth=1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
                git checkout a62370066a97e36d59b200a9fa10c5091f5e8972
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare Instagram IPA
              id: ipa
              run: |
                cd main
                mkdir -p packages
                if wget "$Instagram_URL" --no-verbose -O packages/com.burbn.instagram.ipa; then
                  if [ -n "$EXPECTED_SHA256" ] && [ "$EXPECTED_SHA256" != "skip" ]; then
                    echo "${EXPECTED_SHA256}  packages/com.burbn.instagram.ipa" | shasum -a 256 -c -
                  fi
                  echo "have_ipa=true" >> "$GITHUB_OUTPUT"
                else
                  rm -f packages/com.burbn.instagram.ipa
                  echo "have_ipa=false" >> "$GITHUB_OUTPUT"
                  echo "::warning::instagram-v436.ipa is not on the base-ipa release yet. The tweak will still be compiled."
                fi
                ls -la packages || true
              env:
                THEOS: ${{ github.workspace }}/theos
                Instagram_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.decrypted_instagram_url || 'https://github.com/kamyarjobsss/SCInsta/releases/download/base-ipa/instagram-v436.ipa' }}
                EXPECTED_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha256 || '20f6f7d07523d9f3c0b83faf684b544a58555494f3fbf2e13aa862eefb60357a' }}

            - name: Get Instagram X Version
              id: tweak_version
              run: |
                SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)
                echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
                echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"

            - name: Test VLESS stream settings
              run: |
                cd main
                clang -fobjc-arc -framework Foundation \
                  -I src/Proxy \
                  tests/IXVLESSStreamTest.m src/Proxy/IXVLESSProfile.m \
                  -o /tmp/ix-vless-test
                /tmp/ix-vless-test

            - name: Build Instagram X for sideloading (as IPA)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                cd main
                curl -Lo ipapatch https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64
                chmod +x ipapatch build.sh scripts/build_ixray.sh
                export PATH=.:$PATH
                if [ "${{ steps.ipa.outputs.have_ipa }}" != "true" ]; then
                  ./scripts/build_ixray.sh
                  export IX_HAS_XRAY=1
                  make SIDELOAD=1
                  test -f .theos/obj/debug/SCInsta.dylib
                  echo "Compiled SCInsta.dylib. Packaging waits for instagram-v436.ipa."
                  exit 0
                fi
                ./build.sh sideload
                test -f packages/InstagramX-sideloaded.ipa
                test ! -f packages/InstagramX-lite-sideloaded.ipa
                ls -la packages
              env:
                THEOS: ${{ github.workspace }}/theos
                IX_BUNDLE_ID: ${{ inputs.bundle_id }}
                IX_DISPLAY_NAME: Instagram X

            - name: Rename IPA to include version info
              if: steps.ipa.outputs.have_ipa == 'true'
              run: |
                cd main/packages
                mv InstagramX-sideloaded.ipa "InstagramX_sideloaded_v${SCINSTA_VERSION}.ipa"

            - name: Sanity check the IPA
              if: steps.ipa.outputs.have_ipa == 'true'
              run: |
                cd main
                FULL="packages/InstagramX_sideloaded_v${SCINSTA_VERSION}.ipa"
                python3 scripts/check_sideload_ipa.py "$FULL"
                # otool is the check the owner asked for. The Python check above
                # is what fails the job; this prints the same load list.
                TMP=$(mktemp -d)
                unzip -q "$FULL" "Payload/Instagram.app/Instagram" "Payload/Instagram.app/Frameworks/SCInsta.dylib" "Payload/Instagram.app/Frameworks/IXRayCore.dylib" "Payload/Instagram.app/Info.plist" -d "$TMP"
                echo "---- otool -L Instagram (full) ----"
                otool -L "$TMP/Payload/Instagram.app/Instagram" | awk 'NR==1 || $1 !~ /^\/(usr|System)/'
                echo "---- otool -L SCInsta.dylib (hooking runtime) ----"
                otool -L "$TMP/Payload/Instagram.app/Frameworks/SCInsta.dylib" | awk 'NR<=2 || /substrate|ellekit|ixray|IXRay|@rpath/'
                if otool -L "$TMP/Payload/Instagram.app/Instagram" | grep -q IXRayCore; then
                  echo "IXRayCore must not be a load command"
                  exit 1
                fi
                plutil -lint "$TMP/Payload/Instagram.app/Info.plist"
                rm -rf "$TMP"

            - name: Upload Artifact
              if: steps.ipa.outputs.have_ipa == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_artifact)
              uses: actions/upload-artifact@v4
              with:
                name: InstagramX_v${{ steps.tweak_version.outputs.version }}
                path: |
                  ${{ github.workspace }}/main/packages/InstagramX_sideloaded_v${{ steps.tweak_version.outputs.version }}.ipa
                if-no-files-found: error

            - name: Publish prerelease
              if: steps.ipa.outputs.have_ipa == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
              uses: softprops/action-gh-release@v2.0.6
              with:
                tag_name: instagram-x-v2.1.5
                target_commitish: ${{ github.sha }}
                name: Instagram X 2.1.5
                draft: false
                prerelease: true
                make_latest: false
                generate_release_notes: false
                body: |
                  Sideload builds of Instagram X ${{ steps.tweak_version.outputs.version }}.

                  Built from the GPL-3.0 RyukGram v1.3.2 sources by faroukbmiled, with the Instagram X settings row, VLESS proxy, and launch safe mode. The base is the owner's decrypted Instagram 436 IPA. The closed RyukGram.dylib, RyukGram.bundle, and its load command are removed before injection. CydiaSubstrate, libswiftIU.dylib, and libmobile_first_frame_pipeline.framework stay. Translations ship in InstagramX.bundle. FFmpegKit 6.0 is downloaded at package time from the public ffmpeg-kit iOS build when that download succeeds; it is not taken from the closed bundle.

                  Socket hooks are data-pointer rebinds and run only while the VPN is on. There is no MSHookFunction. Xray is IXRayCore.dylib with no load command.

                  This release is the full build only.

                  v2.1.4 closed the VLESS socket with websocket close 1000 because the outbound overwrote the link's websocket host and TLS SNI with the address, and dialed a DoH-resolved Fastly IP. Fastly then routed the request to the wrong service. v2.1.5 copies host, sni, fingerprint, alpn, path, and ed verbatim, puts the host on wsSettings.host, and dials the address domain so Xray resolves it. `insecure` is accepted as an alias of `allowInsecure`.

                  Story font chips snapped after a few scrolls because the four Persian copies share a real format type with later stock fonts, and the editor keeps the first type match. The chip the user scrolled to stays selected, and reused cells show وکسپید in our font or the stock preview on Instagram's chips.

                  The profile header mark uses the same frame and tint as the + button. The settings screen shows the Wexpid logo and an Instagram @K8myar row. A METAAppGroup that already has an identifier, defaults, and container is left as Instagram created it. Only a nil identifier is filled, and the container path stays Library/Application Support/IXAppGroup.

                  Not tested on a device. Do not install over an account you cannot recover.
                files: |
                  ${{ github.workspace }}/main/packages/InstagramX_sideloaded_v${{ steps.tweak_version.outputs.version }}.ipa

            - name: Output Release URL
              if: steps.ipa.outputs.have_ipa == 'true'
              run: |
                echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases/tag/instagram-x-v2.1.5"
