name: Build Instagram X Add-on

on:
    push:
        branches:
            - cursor/instagram-x-addon-8ca9
        paths:
            - .github/workflows/buildaddon.yml
            - addon/**
            - scripts/inject_addon.py
            - scripts/check_addon_ipa.py
            - scripts/build_ixray.sh
            - scripts/ipa_macho.py
            - src/Launch/**
            - src/Proxy/**
            - src/Location/**
            - src/Brand/**
            - src/Features/General/IXSettingsEntry.m
            - resources/AppIcon/**
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Instagram X Add-on IPA
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version: "1.26.x"

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: Pin Logos to known-good version
              run: |
                cd "$THEOS/vendor/logos"
                git fetch --depth=1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
                git checkout a62370066a97e36d59b200a9fa10c5091f5e8972
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Download Instagram 436
              run: |
                cd main
                mkdir -p packages
                wget --no-verbose -O packages/com.burbn.instagram.ipa \
                  https://github.com/kamyarjobsss/SCInsta/releases/download/base-ipa/instagram-v436.ipa
                echo "20f6f7d07523d9f3c0b83faf684b544a58555494f3fbf2e13aa862eefb60357a  packages/com.burbn.instagram.ipa" | shasum -a 256 -c -

            - name: Build the add-on
              run: |
                cd main
                chmod +x scripts/build_ixray.sh
                ./scripts/build_ixray.sh
                export IX_HAS_XRAY=1
                make -C addon
                DYLIB="addon/.theos/obj/debug/InstagramXAddon.dylib"
                test -f "$DYLIB"
                install_name_tool -id @rpath/InstagramXAddon.dylib "$DYLIB"
                if otool -L "$DYLIB" | grep -E 'CydiaSubstrate|substrate'; then
                  echo "add-on must not link CydiaSubstrate"
                  exit 1
                fi
                if strings "$DYLIB" | grep -F MSHookFunction; then
                  echo "add-on contains MSHookFunction"
                  exit 1
                fi
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Inject into the 436 IPA
              run: |
                cd main
                python3 scripts/inject_addon.py \
                  packages/com.burbn.instagram.ipa \
                  addon/.theos/obj/debug/InstagramXAddon.dylib \
                  vendor/ixray/IXRayCore.dylib
                python3 scripts/check_addon_ipa.py packages/com.burbn.instagram.ipa
                mv packages/com.burbn.instagram.ipa packages/InstagramX_addon_436_v1.0.0.ipa
                ls -lh packages

            - name: Publish prerelease
              uses: softprops/action-gh-release@v2.0.6
              with:
                tag_name: instagram-x-addon-436-v1.0.0
                target_commitish: ${{ github.sha }}
                name: Instagram X Add-on 1.0.0 for Instagram 436
                draft: false
                prerelease: true
                make_latest: false
                generate_release_notes: false
                body: |
                  Instagram X Add-on for the owner's Instagram 436.0.0 IPA.

                  RyukGram.dylib, RyukGram.bundle, and the rest of that IPA are unchanged. This adds InstagramXAddon.dylib, one weak load command, IXRayCore.dylib with no load command, and the Instagram X icon and display name.

                  The add-on is the settings row under Accounts Center, a page with the VLESS proxy and fake location, and launch safe mode. It does not include SCInsta. Socket hooks are data-pointer rebinds and run only while the proxy is on. There is no MSHookFunction.

                  Not tested on a device. The other tweak in the IPA is left as it was shipped.
                files: |
                  ${{ github.workspace }}/main/packages/InstagramX_addon_436_v1.0.0.ipa
